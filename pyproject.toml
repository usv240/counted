[project]
name = "counted"
version = "0.1.0"
description = "Counted: an AI agent that finds the disaster hidden inside a death, so no disaster death goes uncounted."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.25.2",
    "boto3>=1.43.123",
    "cedarpy>=4.12.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    "strands-agents-evals>=1.8.0",
    "strands-agents[a2a,otel]>=1.63.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
counted-api = "counted.service.api:main"
counted-mcp = "counted.service.mcp_server:main"
counted-eval = "evals.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counted"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
