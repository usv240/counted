name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # The decision tree, the documents, and the red-team suite against the real agent loop with a scripted model.
    # No AWS credentials: every guard is proven offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - run: uv run pytest tests -q
      - run: uv run python -m evals.guard_ablation
